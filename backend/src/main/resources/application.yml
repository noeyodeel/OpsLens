spring:
  application:
    name: OpsLens
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opslens}
    username: ${SPRING_DATASOURCE_USERNAME:opslens}
    password: ${SPRING_DATASOURCE_PASSWORD:opslens}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:opslens}
    password: ${SPRING_RABBITMQ_PASSWORD:opslens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

knowledge:
  directory: ${KNOWLEDGE_DIR:../docs/knowledge-local}
